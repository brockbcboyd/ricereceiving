<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rice Receiving Appointments</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="brand">CAROLINA ATLANTIC · RICE RECEIVING</div></header><main class="wrap"><div class="card"><div class="steps"><div class="stepwrap"><span>Your info</span><i class="step on"></i></div><div class="stepwrap"><span>Pick a date</span><i class="step"></i></div><div class="stepwrap"><span>Truck type</span><i class="step"></i></div><div class="stepwrap"><span>Pick a time</span><i class="step"></i></div><div class="stepwrap"><span>Confirm</span><i class="step"></i></div></div><div id="screen"></div></div></main><script>
const state={step:0,carrying:[]}; const el=document.querySelector('#screen'), bars=[...document.querySelectorAll('.step')]; const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(){bars.forEach((b,i)=>b.classList.toggle('on',i<=state.step))} function actions(back=true,next='Continue'){return `<div class="actions">${back?'<button class="secondary" onclick="prev()">Back</button>':'<span></span>'}<button class="primary" onclick="next()">${next}</button></div>`} function render(){nav(); if(state.step===0) info();if(state.step===1) dates();if(state.step===2) types();if(state.step===3) times();if(state.step===4) confirm()}
function info(){el.innerHTML=`<h1>Schedule a receiving appointment</h1><p class="muted">Enter the information for this load.</p><div class="grid"><div class="field"><label>Carrier company</label><input id="carrier" value="${esc(state.carrier)}"></div><div class="field"><label>Order number</label><input id="order" value="${esc(state.order_number)}"></div><div class="field"><label>Driver name</label><input id="driver" value="${esc(state.driver_name)}"></div><div class="field"><label>Phone number</label><input id="phone" type="tel" value="${esc(state.phone)}"></div></div><div class="field"><label>What are you carrying?</label><div class="checks">${['Shingles','Rolls','Boxes','Other'].map(x=>`<label><input type="checkbox" name="carry" value="${x}" ${state.carrying?.includes(x)?'checked':''}> ${x}</label>`).join('')}</div></div><div class="field"><label>Pickup location</label><input id="pickup" value="${esc(state.pickup_location)}"></div><div id="err" class="error"></div>${actions(false)}`}
function next(){if(state.step===0){state.carrier=carrier.value.trim();state.order_number=order.value.trim();state.driver_name=driver.value.trim();state.phone=phone.value.trim();state.pickup_location=pickup.value.trim();state.carrying=[...document.querySelectorAll('[name=carry]:checked')].map(x=>x.value);if(!state.carrier||!state.order_number||!state.driver_name||!state.phone||!state.pickup_location||!state.carrying.length){err.textContent='Please complete all required fields.';return}}if(state.step===1&&!state.date)return;if(state.step===2&&!state.truck_type)return;if(state.step===3&&!state.start_time)return; if(state.step<4){state.step++;render()}else submit()}; function prev(){state.step--;render()}
function dates(){let ds=[];for(let i=1;ds.length<9;i++){let d=new Date();d.setDate(d.getDate()+i);if(d.getDay()!=0&&d.getDay()!=6)ds.push(d)} el.innerHTML=`<h1>Pick a date</h1><div class="notice">Appointments must be scheduled in advance. Weekend receiving is not available.</div><div class="dates">${ds.map(d=>{let v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return `<div class="choice ${state.date===v?'selected':''}" onclick="state.date='${v}';render()"><b>${d.toLocaleDateString(undefined,{weekday:'short'})}</b><br>${d.toLocaleDateString()}</div>`}).join('')}</div>${actions()}`}
function types(){let a=['Flatbed','Van / Box Truck'];el.innerHTML=`<h1>Truck type</h1><p class="muted">Select the truck arriving for this appointment.</p><div class="types">${a.map(x=>`<div class="choice ${state.truck_type===x?'selected':''}" onclick="state.truck_type='${x}';render()">${x}</div>`).join('')}</div>${actions()}`}
async function times(){el.innerHTML='<h1>Pick a time</h1><p>Loading available appointments…</p>';let a=await fetch('/api/availability?date='+state.date+'&truck_type='+encodeURIComponent(state.truck_type)).then(r=>r.json());el.innerHTML=`<h1>Pick a time</h1><p class="muted">Available receiving times for ${state.date}. ${state.truck_type==='Flatbed'?'Flatbeds reserve 30 minutes.':'Van / Box Trucks reserve 1 hour.'}</p><div class="times">${a.length?a.map(x=>`<div class="choice ${state.start_time===x?'selected':''}" onclick="state.start_time='${x}';render()">${fmt(x)}</div>`).join(''):'<p>No appointments available.</p>'}</div>${actions()}`}
function fmt(t){let [h,m]=t.split(':').map(Number),ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(m).padStart(2,'0')} ${ap}`}
function confirm(){el.innerHTML=`<h1>Confirm appointment</h1><p>Please verify the information below.</p><div class="appt-grid"><div><b>Date</b><br>${state.date}</div><div><b>Time</b><br>${fmt(state.start_time)}</div><div><b>Carrier</b><br>${esc(state.carrier)}</div><div><b>Truck type</b><br>${esc(state.truck_type)}</div><div><b>Order #</b><br>${esc(state.order_number)}</div><div><b>Driver</b><br>${esc(state.driver_name)}</div><div><b>Phone</b><br>${esc(state.phone)}</div><div><b>Carrying</b><br>${esc(state.carrying.join(', '))}</div><div><b>Pickup location</b><br>${esc(state.pickup_location)}</div></div><div id="err" class="error"></div>${actions(true,'Confirm appointment')}`}
async function submit(){let r=await fetch('/api/appointments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...state,carrying:state.carrying.join(', ')})}),j=await r.json();if(!r.ok){err.textContent=j.error;return}el.innerHTML=`<h1>Appointment confirmed</h1><p class="success">Your receiving appointment has been scheduled.</p><p><b>${state.date} at ${fmt(state.start_time)}</b></p><button class="primary" onclick="location.reload()">Schedule another</button>`} render();
</script></body></html>
