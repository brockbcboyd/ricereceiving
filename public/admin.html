<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receiving Admin</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="brand">CAROLINA ATLANTIC · RECEIVING ADMIN</div></header><main class="wrap"><div id="app"></div></main><script>
const app=document.querySelector('#app');let days=1,data=[];const E=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const F=t=>{let[h,m]=t.split(':').map(Number),a=h>=12?'PM':'AM';return`${h%12||12}:${String(m).padStart(2,'0')} ${a}`};async function boot(){let m=await fetch('/api/admin/me').then(r=>r.json());m.loggedIn?load():login()}function login(){app.innerHTML=`<div class="card login"><h1>Receiving admin</h1><div class="field"><label>Username</label><input id="u" autocomplete="username" value="admin"></div><div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')go()"></div><div id="err" class="error"></div><button class="primary" onclick="go()">Sign in</button></div>`}async function go(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(r.ok)load();else err.textContent='Incorrect username or password.'}async function load(){let r=await fetch('/api/admin/appointments?days='+days);if(r.status===401)return login();data=await r.json();render()}function periodText(){if(days===1)return`${data.length} scheduled for today`;if(days===7)return`${data.length} scheduled over the next 7 days`;if(days===30)return`${data.length} scheduled over the next 30 days`;return`${data.length} scheduled over the next 60 days`}function render(){app.innerHTML=`<div class="card"><div class="appt-head"><div><h1>Upcoming appointments</h1><p class="muted">${periodText()}</p></div><button class="secondary" onclick="logout()">Sign out</button></div><div class="tabs">${[[1,'Today'],[7,'Week'],[30,'Month'],[60,'60 Days']].map(x=>`<button class="${days===x[0]?'active':''}" onclick="days=${x[0]};load()">${x[1]}</button>`).join('')}</div>${data.length?data.map(card).join(''):'<div class="empty">No appointments scheduled.</div>'}</div>`}function card(a){return `<div class="appt"><div class="appt-head"><div><b>${E(a.date)} · ${F(a.start_time)}</b><br>${E(a.carrier)} · ${E(a.truck_type)}</div><button class="secondary" onclick="edit(${a.id})">Edit</button></div><div class="appt-grid"><div><b>Order</b><br>${E(a.order_number)}</div><div><b>Driver</b><br>${E(a.driver_name)}</div><div><b>Phone</b><br>${E(a.phone)}</div><div><b>Carrying</b><br>${E(a.carrying)}</div><div><b>Pickup location</b><br>${E(a.pickup_location)}</div></div></div>`}function edit(id){let a=data.find(x=>x.id===id);app.innerHTML=`<div class="card"><h1>Edit appointment</h1>${[['date','Date','date'],['start_time','Start time','time'],['truck_type','Truck type','text'],['carrier','Carrier company','text'],['order_number','Order number','text'],['driver_name','Driver name','text'],['phone','Phone number','tel'],['carrying','Carrying','text'],['pickup_location','Pickup location','text']].map(([k,l,t])=>`<div class="field"><label>${l}</label><input type="${t}" id="${k}" value="${E(a[k])}"></div>`).join('')}<div id="err" class="error"></div><div class="actions admin-actions"><button class="danger" onclick="removeAppt(${id})">Remove appointment</button><span><button class="secondary" onclick="load()">Cancel</button> <button class="primary" onclick="save(${id})">Save changes</button></span></div></div>`}async function save(id){let body={};['date','start_time','truck_type','carrier','order_number','driver_name','phone','carrying','pickup_location'].forEach(k=>body[k]=document.getElementById(k).value.trim());let r=await fetch('/api/admin/appointments/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok)load();else err.textContent=(await r.json()).error}async function removeAppt(id){if(!confirm('Remove this appointment? This cannot be undone.'))return;let r=await fetch('/api/admin/appointments/'+id,{method:'DELETE'});if(r.ok)load();else alert((await r.json()).error||'Unable to remove appointment.')}async function logout(){await fetch('/api/admin/logout',{method:'POST'});login()}boot();
</script></body></html>
