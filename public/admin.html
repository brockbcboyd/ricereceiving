<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receiving Admin</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="brand">CAROLINA ATLANTIC · RECEIVING ADMIN</div></header><main class="wrap"><div id="app"></div></main><script>
const app=document.querySelector('#app');let days=1,data=[];const E=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const F=t=>{let[h,m]=t.split(':').map(Number),ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(m).padStart(2,'0')} ${ap}`};
async function boot(){let m=await fetch('/api/admin/me').then(r=>r.json());m.loggedIn?load():login()}
function login(){app.innerHTML=`<div class="card admin-login"><h1>Receiving admin</h1><div class="field"><label>Password</label><input id="p" type="password" autofocus></div><div id="err" class="error"></div><button class="primary" onclick="go()">Sign in</button></div>`;p.addEventListener('keydown',e=>{if(e.key==='Enter')go()})}
async function go(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})});if(r.ok)load();else err.textContent='Incorrect password.'}
async function load(){let r=await fetch('/api/admin/appointments?days='+days);if(r.status===401)return login();data=await r.json();render()}
function render(){let label=days===1?'today':`over the next ${days} days`;app.innerHTML=`<div class="card"><div class="appt-head"><div><h1>Upcoming appointments</h1><p class="muted">${data.length} scheduled ${label}</p></div><button class="secondary" onclick="logout()">Sign out</button></div><div class="tabs"><button onclick="blackouts()">Blackouts</button>${[[1,'Today'],[7,'Week'],[30,'Month'],[60,'60 Days']].map(x=>`<button class="${days===x[0]?'active':''}" onclick="days=${x[0]};load()">${x[1]}</button>`).join('')}</div>${data.length?data.map(card).join(''):'<p>No appointments scheduled.</p>'}</div>`}
function card(a){return `<div class="appt"><div class="appt-head"><div><b>${E(a.date)} · ${F(a.start_time)}</b><br>${E(a.carrier)} · ${E(a.truck_type)}</div><button class="secondary" onclick="edit(${a.id})">Edit</button></div><div class="appt-grid"><div><b>Order</b><br>${E(a.order_number)}</div><div><b>Driver</b><br>${E(a.driver_name)}</div><div><b>Phone</b><br>${E(a.phone)}</div><div><b>Carrying</b><br>${E(a.carrying)}</div><div><b>Pickup location</b><br>${E(a.pickup_location)}</div></div></div>`}
function edit(id){let a=data.find(x=>x.id===id);app.innerHTML=`<div class="card"><h1>Edit appointment</h1>${['date','start_time','truck_type','carrier','order_number','driver_name','phone','carrying','pickup_location'].map(k=>`<div class="field"><label>${k.replaceAll('_',' ')}</label><input id="${k}" value="${E(a[k])}"></div>`).join('')}<div id="err" class="error"></div><div class="actions"><button class="danger" onclick="removeAppt(${id})">Remove appointment</button><span><button class="secondary" onclick="load()">Cancel</button> <button class="primary" onclick="save(${id})">Save changes</button></span></div></div>`}
async function save(id){let body={};['date','start_time','truck_type','carrier','order_number','driver_name','phone','carrying','pickup_location'].forEach(k=>body[k]=document.getElementById(k).value);let r=await fetch('/api/admin/appointments/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok)load();else err.textContent=(await r.json()).error}
async function removeAppt(id){if(!confirm('Remove this appointment?'))return;let r=await fetch('/api/admin/appointments/'+id,{method:'DELETE'});if(r.ok)load()}

async function blackouts(){let list=await fetch('/api/admin/blackouts').then(r=>r.json());app.innerHTML=`<div class="card"><div class="appt-head"><div><h1>Receiving blackouts</h1><p class="muted">Block an entire receiving day or one 30-minute capacity block.</p></div><button class="secondary" onclick="load()">Appointments</button></div><div class="grid"><div class="field"><label>Date</label><input id="bd" type="date"></div><div class="field"><label>Block</label><select id="bt" onchange="bst.disabled=this.value==='ALL'"><option value="ALL">Entire day</option>${Array.from({length:16},(_,i)=>{let m=420+i*30,t=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');return `<option value="${t}">${F(t)}</option>`}).join('')}</select></div><div class="field"><label>Time block</label><select id="bst" disabled>${Array.from({length:16},(_,i)=>{let m=420+i*30,t=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');return `<option value="${t}">${F(t)}</option>`}).join('')}</select></div><div class="field"><label>Reason (optional)</label><input id="br" placeholder="Holiday, meeting, maintenance…"></div></div><div id="err" class="error"></div><button class="primary" onclick="addBlackout()">Add blackout</button><hr>${list.length?list.map(b=>`<div class="appt"><div class="appt-head"><div><b>${E(b.date)} · ${b.all_day?'Entire day':F(b.start_time)}</b>${b.reason?`<br>${E(b.reason)}`:''}</div><button class="danger" onclick="removeBlackout(${b.id})">Remove</button></div></div>`).join(''):'<p>No blackouts configured.</p>'}</div>`;bt.onchange=()=>{bst.disabled=bt.value==='ALL';};}
async function addBlackout(){let all=bt.value==='ALL';let r=await fetch('/api/admin/blackouts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:bd.value,all_day:all,start_time:all?'':bst.value,reason:br.value})});if(r.ok)blackouts();else err.textContent=(await r.json()).error;}
async function removeBlackout(id){if(!confirm('Remove this blackout?'))return;let r=await fetch('/api/admin/blackouts/'+id,{method:'DELETE'});if(r.ok)blackouts();}

async function logout(){await fetch('/api/admin/logout',{method:'POST'});login()}boot();
</script></body></html>
